# Microfone virtual alimentado pelo celular (USB).
#   phone_mic_in = lado "sink": onde o stream do celular entra (nao e saida de verdade)
#   phone_mic    = lado "source": o microfone que apps e jogos enxergam
# Trocado de Audio/Duplex pra loopback porque o duplex aparecia tambem como
# DISPOSITIVO DE SAIDA no Discord/pavucontrol.
#
# ATENCAO: o parser do PipeWire nao aceita caracteres non-ASCII, nem em
# comentario. Manter este arquivo sem acentos.

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            audio.rate     = 48000
            audio.position = [ MONO ]
            capture.props = {
                node.name        = "phone_mic_in"
                node.description = "Celular mic - so entrada (nao use como saida)"
                media.class      = Audio/Sink
                node.latency     = 256/48000
                priority.session = 0
                priority.driver  = 0
            }
            playback.props = {
                node.name        = "phone_mic"
                node.description = "Celular (mic via USB)"
                media.class      = Audio/Source
                node.latency     = 256/48000
            }
        }
    }
]
