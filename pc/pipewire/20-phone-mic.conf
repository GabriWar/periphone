# Virtual microphone fed by the phone (USB).
#   phone_mic_in = "sink" side: where the phone's stream goes in (not a real output)
#   phone_mic    = "source" side: the microphone apps and games see
# A loopback instead of Audio/Duplex because the duplex node also showed up
# as an OUTPUT DEVICE in Discord/pavucontrol.
#
# WARNING: the PipeWire config parser does not accept non-ASCII characters,
# not even in comments. Keep this file ASCII only.

context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            audio.rate     = 48000
            audio.position = [ MONO ]
            capture.props = {
                node.name        = "phone_mic_in"
                node.description = "Phone mic - input only (do not use as output)"
                media.class      = Audio/Sink
                node.latency     = 256/48000
                priority.session = 0
                priority.driver  = 0
            }
            playback.props = {
                node.name        = "phone_mic"
                node.description = "Phone mic (USB)"
                media.class      = Audio/Source
                node.latency     = 256/48000
            }
        }
    }
]
