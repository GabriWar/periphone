# Receives the phone mic (USB Audio Bridge app) and delivers it to the "phone_mic" node.
# The app connects to 127.0.0.1:12346 through the cable (adb reverse) and sends
# S16LE mono 48 kHz.
#
# WARNING: the PipeWire config parser does not accept non-ASCII characters,
# not even in comments. Keep this file ASCII only.
#
# Listens on loopback only on purpose.

context.modules = [
    {   name = libpipewire-module-protocol-simple
        args = {
            capture  = false
            playback = true
            audio.rate     = 48000
            audio.format   = S16LE
            audio.channels = 1
            audio.position = [ MONO ]
            server.address = [ "tcp:127.0.0.1:12346" ]
            playback.props = {
                target.object    = "phone_mic_in"
                node.name        = "phone-mic-tcp"
                node.description = "Phone mic (TCP)"
                node.latency     = 256/48000
            }
        }
    }
]
