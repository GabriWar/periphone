# Recebe o microfone do celular (app USB Audio Bridge) e entrega no no "phone_mic".
# O app conecta em 127.0.0.1:12346 pelo cabo (adb reverse) e manda S16LE mono 48 kHz.
#
# ATENCAO: o parser do PipeWire nao aceita caracteres non-ASCII, nem em
# comentario. Manter este arquivo sem acentos.
#
# Escuta so em loopback de proposito.

context.modules = [
    {   name = libpipewire-module-protocol-simple
        args = {
            capture  = false
            playback = true
            audio.rate     = 48000
            audio.format   = S16LE
            audio.channels = 1
            audio.position = [ MONO ]
            server.address = [ "tcp:127.0.0.1:12346" ]
            playback.props = {
                target.object    = "phone_mic_in"
                node.name        = "phone-mic-tcp"
                node.description = "Mic do celular (TCP)"
                node.latency     = 256/48000
            }
        }
    }
]
