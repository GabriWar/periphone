# PC output -> phone (-> headphones).
#
# Creates the "phone_speaker" sink and serves its monitor over TCP on
# 127.0.0.1:12345 (S16LE 48 kHz stereo). The phone reaches that port through
# the USB cable via "adb reverse tcp:12345 tcp:12345" (phone-bridge does it).
#
# WARNING: the PipeWire config parser does not accept non-ASCII characters,
# not even in comments. Keep this file ASCII only.
#
# Listens on loopback only on purpose: no audio exposed on the network.
# node.latency 256/48000 = 5.3 ms quantum (was 512): less delay before the
# audio even reaches the socket.

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "phone_speaker"
            node.description = "Phone speaker (USB)"
            media.class      = "Audio/Sink"
            audio.position   = "FL,FR"
            audio.rate       = 48000
            node.latency     = 256/48000
        }
    }
]

context.modules = [
    {   name = libpipewire-module-protocol-simple
        args = {
            capture  = true
            playback = false
            audio.rate     = 48000
            audio.format   = S16LE
            audio.channels = 2
            audio.position = [ FL FR ]
            server.address = [ "tcp:127.0.0.1:12345" ]
            capture.props = {
                target.object        = "phone_speaker"
                stream.capture.sink  = true
                node.name            = "phone-speaker-tcp"
                node.description     = "TCP stream to the phone"
                node.latency         = 256/48000
            }
        }
    }
]
