# Saida do PC -> celular -> fone Bluetooth, tudo open source.
#
# Cria o sink "phone_speaker" e serve o monitor dele por TCP em
# 127.0.0.1:12345 (S16LE 48kHz estereo). O celular alcanca essa porta
# pelo cabo USB via "adb reverse tcp:12345 tcp:12345", e um player
# open source (Simple Protocol Player, F-Droid) toca o stream.
#
# ATENCAO: o parser do PipeWire nao aceita caracteres non-ASCII, nem em
# comentario. Manter este arquivo sem acentos.
#
# Escuta so em loopback de proposito: nada de audio exposto na rede.

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "phone_speaker"
            node.description = "Celular (saida via USB)"
            media.class      = "Audio/Sink"
            audio.position   = "FL,FR"
            audio.rate       = 48000
            node.latency     = 512/48000
        }
    }
]

context.modules = [
    {   name = libpipewire-module-protocol-simple
        args = {
            capture  = true
            playback = false
            audio.rate     = 48000
            audio.format   = S16LE
            audio.channels = 2
            audio.position = [ FL FR ]
            server.address = [ "tcp:127.0.0.1:12345" ]
            capture.props = {
                target.object        = "phone_speaker"
                stream.capture.sink  = true
                node.name            = "phone-speaker-tcp"
                node.description     = "Stream TCP p/ celular"
                node.latency         = 256/48000
            }
        }
    }
]
